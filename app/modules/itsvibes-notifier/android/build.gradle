plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.itsvibesnotifier'
version = '1.0.0'

android {
  namespace "expo.modules.itsvibesnotifier"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
